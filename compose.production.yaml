name: fund-keeper-production

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-fund_keeper}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 640m

  mysql:
    image: mysql:8.4.8
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      TZ: Asia/Shanghai
    command:
      - --innodb-buffer-pool-size=256M
      - --max-connections=50
    volumes:
      - mysql-production-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 768m

  redis:
    image: redis:7.4.9-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-production-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 192m

volumes:
  mysql-production-data:
  redis-production-data:
